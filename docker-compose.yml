version: '3.8'

services:
  # 1. Database Service (Supabase Postgres)
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./apps/server/supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service (NestJS)
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 配置真实 Supabase 信息后将使用 Supabase Postgres；
      # 保持 placeholder 时后端自动使用内存演示数据（含种子老人/活动/报名）
      SUPABASE_URL: ${SUPABASE_URL:-http://placeholder-project.supabase.co}
      SUPABASE_KEY: ${SUPABASE_KEY:-placeholder-key}

  # 3. Frontend Service (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
